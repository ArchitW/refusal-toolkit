[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-toolkit"
version = "0.1.0"
description = "Production-grade framework for removing (or inducing) refusal behavior in LLMs via representation engineering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Refusal Toolkit Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "safetensors>=0.4.0",
]
optional-dependencies = {
    "dev" = [
        "pytest>=7.0.0",
        "black>=23.0.0",
        "ruff>=0.1.0",
        "mypy>=1.0.0",
    ],
    "code" = [
        "tree-sitter>=0.21.0",
        "tree-sitter-languages>=1.10.0",
    ],
    "sae" = [
        "wandb>=0.16.0",
    ],
}

[project.scripts]
refusal-toolkit = "refusal_toolkit:main"

[project.urls]
Homepage = "https://github.com/yourusername/refusal-toolkit"
Repository = "https://github.com/yourusername/refusal-toolkit"
Issues = "https://github.com/yourusername/refusal-toolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20"]
ignore = ["E501", "B008"]
fixable = ["E", "F", "I", "UP", "B", "C4", "PTH"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true